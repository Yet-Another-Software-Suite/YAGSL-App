name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact_name: yagsl-configurator-linux.tar.gz
          - os: windows-latest
            target: windows
            artifact_name: yagsl-configurator-windows.zip
          - os: macos-latest
            target: macos
            artifact_name: yagsl-configurator-macos.zip
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev
      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ${{ matrix.target }} --release
      - name: Package artifact (Linux)
        if: matrix.target == 'linux'
        run: |
          tar -C build/linux/x64/release -czf ${{ matrix.artifact_name }} bundle
      - name: Package artifact (Windows)
        if: matrix.target == 'windows'
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ${{ matrix.artifact_name }}
        shell: pwsh
      - name: Package artifact (macOS)
        if: matrix.target == 'macos'
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/ yagsl-configurator-macos.zip
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
